runner:
  redis:
    host: host.docker.internal # Redis server hostname
    port: 6379 # Redis server port
    # username: "default"  # ACL username (Redis 6.0+)
    # password: "redis-password"  # Authentication password
    # url: redis://host.docker.internal:6379 # Redis server URL (alternative to host and port) 
    database: 0 # Database index to use (0-15)
    timeout: PT30S # Connection timeout (30 seconds)

  test:
    mode: standalone # Options: standalone, cluster
    clients: 50 # Number of concurrent clients
    workload:
      type: get_set # Options: redis_commands, get_set, multi, pub_sub
      maxDuration: PT70S # Maximum test duration
      options:
        # General workload options
        batchSize: 200 # Operations per batch
        getSetRatio: 0.5 # 30% GET, 70% SET operations
        valueSize: 100 # Size of values in bytes
        # iterationCount: 1000000  # Total number of iterations (optional)
        # delayAfterIteration: PT1S  # Delay between iterations (1ms)

        # Specific workload options
        elementsCount: 10 # Number of elements for list operations
        transactionSize: 20 # Number of commands per transaction (for multi)

        # Key generation options
        keyGenerationStrategy: random # Options: random, sequential
        keyPattern: "key-%d" # Pattern for generated keys
        keyRangeMin: 1 # Minimum key number
        keyRangeMax: 1000000 # Maximum key number

  # Redis client options
  clientOptions:
    RESP: 3
    socket:
      # Socket configuration
      noDelay: true # Disable Nagle's algorithm (TCP_NODELAY)
      keepAlive: true # Enable TCP keep-alive
      keepAliveInitialDelay: PT60S # Initial delay for keep-alive probes (60s)
      tls: false # Enable TLS/SSL for secure connections
      # TLS configuration (when tls is true)
      # ca: "/path/to/ca.crt"  # Certificate Authority certificate
      # cert: "/path/to/client.crt"  # Client certificate
      # key: "/path/to/client.key"  # Client private key
      # passphrase: "key-passphrase"  # Passphrase for private key
      rejectUnauthorized: true # Verify server certificate
      # socketTimeout: PT5S # Socket timeout (5 seconds)

    # Command queue and offline behavior
    # commandsQueueMaxLength: 1000  # Maximum command queue length
    # disableOfflineQueue: false  # Disable command buffering when disconnected

    # Connection behavior
    readonly: false # Connect in readonly mode (for replicas)
    name: "node-redis-test-app" # Client connection name

    # Client behavior
    disableClientInfo: true # Disable client info commands
    # clientInfoTag: "node-redis-test-app-client" # Client info tag for identification

    # Health check and monitoring
    pingInterval: PT30S # PING interval for connection health checks (30s)

    commandOptions:
      timeout: PT0.1S # Command timeout (100ms)

    # Redis Enterprise maintenance options
    maintPushNotifications: auto # Options: disabled, enabled, auto
    maintMovingEndpointType: auto # Options: auto, internal-ip, internal-fqdn, external-ip, external-fqdn, none
    maintRelaxedCommandTimeout: PT10S # Command timeout during maintenance
    maintRelaxedSocketTimeout: PT10S # Socket timeout during maintenance

  # Cluster client options (for cluster mode)
  clusterClientOptions:
    minimizeConnections: true # Minimize number of connections
    useReplicas: false # Use replica nodes for read commands
    maxCommandRedirections: 16 # Maximum number of command redirections
