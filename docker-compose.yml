name: node-redis-test-app

x-app-common: &app-common
  environment:
    - NODE_ENV=${NODE_ENV:-production}
    - RUN_ID=${RUN_ID}
    - WORKLOAD=${WORKLOAD}
    - LOG_LEVEL=${LOG_LEVEL}
    - METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS}
    - METRICS_EXPORTER_ENDPOINT=${METRICS_EXPORTER_ENDPOINT}
    - APP_NAME=${APP_NAME}
    - VERSION=${VERSION}
    - ENABLE_OTEL=${ENABLE_OTEL}
    - LOG_PRETTY=${LOG_PRETTY}
    - DEBUG_MAINTENANCE=${DEBUG_MAINTENANCE}
  deploy:
    replicas: ${REPLICAS:-1}

services:
  app:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - REPO_URL=${REPO_URL}
        - REPO_BRANCH=${REPO_BRANCH}
    profiles:
      - prod
    volumes:
      # Mount workloads
      - ./workloads:/app/workloads:ro
      - ./out:/app/out:rw
    command: ${DOCKER_COMMAND:-node --require ./build/instrumentation.js build/main.js}

  app-dev:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        - REPO_URL=${REPO_URL}
        - REPO_BRANCH=${REPO_BRANCH}
    profiles:
      - dev
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Mount workloads
      - ./workloads:/app/workloads:ro
      - ./out:/app/out:rw
    command: ${DOCKER_COMMAND:-npm run dev}
