name: node-redis-test-app

x-app-common: &app-common
  environment:
    - NODE_ENV=${NODE_ENV:-production}
    - RUN_ID=${RUN_ID}
    - WORKLOAD=${WORKLOAD}
    - LOG_LEVEL=${LOG_LEVEL}
    - METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS}
  deploy:
    replicas: ${REPLICAS:-1}

services:
  app:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - prod
    volumes:
      # Mount workloads
      - ./workloads:/app/workloads:ro
    command: ${DOCKER_COMMAND:-node --require ./build/instrumentation.js build/main.js}

  app-dev:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles:
      - dev
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Mount workloads
      - ./workloads:/app/workloads:ro
    command: ${DOCKER_COMMAND:-npm run dev}

  redis:
    image: redislabs/client-libs-test:8.2-RC1-pre
    platform: linux/amd64
    profiles:
      - dev
    ports:
      - "6379:3000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    depends_on:
      - ${APP_SERVICE:-app}

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0:0" # Run as root to avoid permission issues
    volumes:
      - ./grafana/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-storage:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    environment:
      - TEMPO_STORAGE_TRACE_BACKEND=local

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki

  grafana-alloy:
    image: grafana/alloy:latest
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "4318:4318" # OTLP HTTP
      - "4317:4317" # OTLP gRPC
      - "12345:12345" # Alloy HTTP server
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  grafana-storage:
  tempo-storage:
  loki-storage:
